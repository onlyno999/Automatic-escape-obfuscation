name: 转义+混淆

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 转义+混淆 abc.js 生成 _worker.js
        run: node scripts/transform.mjs abc.js _worker.js

      - name: 有变化就提交推送
        run: |
          git config user.name "escape-obfuscate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _worker.js
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "转义+混淆 abc.js 生成 _worker.js"
            git push
          fi
